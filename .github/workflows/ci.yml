name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 根 package.json 用 workspaces 管 frontend 和 backend，一次 npm ci 就够。
      - name: 安装依赖
        run: npm ci

      # 顺序固定：先类型检查（最快、错误最具体），再测试，最后构建。
      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build
